limit_req_zone $binary_remote_addr zone=imports:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
map $http_x_forwarded_proto $forwarded_proto { default $scheme; https https; }
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self' https://ssau.ru" always;
    location = /api/import/ {
        limit_req zone=imports burst=4 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params_ssau;
        proxy_pass http://backend:8000;
    }
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params_ssau;
        proxy_pass http://backend:8000;
    }
    location / { try_files $uri $uri/ /index.html; }
}
