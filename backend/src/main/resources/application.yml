server:
  port: ${SERVER_PORT:8000}
  address: ${SERVER_ADDRESS:127.0.0.1}
  error:
    include-message: never
    include-stacktrace: never
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:bibliography}}
    username: ${POSTGRES_USER:bibliography}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-trailing-tokens: true
bibliography:
  crossref-mailto: ${CROSSREF_MAILTO:}
  trust-proxy-headers: ${TRUST_PROXY_HEADERS:false}
