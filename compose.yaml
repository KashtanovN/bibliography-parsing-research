services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bibliography
      POSTGRES_USER: bibliography
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibliography -d bibliography"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      POSTGRES_DB: bibliography
      POSTGRES_USER: bibliography
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      CROSSREF_MAILTO: ${CROSSREF_MAILTO:-}
      # Backend has no published port. Only the internal Nginx sets X-Real-IP.
      TRUST_PROXY_HEADERS: 'true'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
